version: "3.9"

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: groceryiq
      POSTGRES_PASSWORD: groceryiq
      POSTGRES_DB: groceryiq
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # Uncomment once you've written Dockerfiles for each app (Phase 7)
  # core-service:
  #   build: ./apps/core-service
  #   env_file: .env
  #   ports:
  #     - "4000:4000"
  #   depends_on:
  #     - postgres
  #     - redis
  #
  # ml-service:
  #   build: ./apps/ml-service
  #   env_file: .env
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     - postgres
  #     - ollama
  #
  # web:
  #   build: ./apps/web
  #   env_file: .env
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - core-service

volumes:
  pg_data:
  ollama_data:
